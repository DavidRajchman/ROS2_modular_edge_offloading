networks:
  pubnet:
    external: true

services:
  # Override VHC to use host network (runs on its own physical machine; no macvlan IP needed)
  ros2_vhc:
    network_mode: host
  # Host's own IP will be advertised. Ensure required ports are exposed/allowed.
  # Removed 'networks' key to avoid conflict (docker compose forbids network_mode + networks).

  # Override MEC similarly to use host network on its own machine.
  ros2_mec:
    network_mode: host
  # Removed 'networks' key to avoid conflict.

  discovery_service:
    networks:
      pubnet:
        ipv4_address: 192.168.50.114
  offloading_manager:
    networks:
      pubnet:
        ipv4_address: 192.168.50.115
  bridge:
    networks:
      pubnet:
        ipv4_address: 192.168.50.116