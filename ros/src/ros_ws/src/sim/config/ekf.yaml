### ekf config file ###
ekf_filter_node:
  ros__parameters:
    # Ekf config file
    odom_frame: "vehicle_blue/odom"
    base_frame: "vehicle_blue/chassis"
    world_frame: "vehicle_blue/odom"

    # Parametry pro odometrie
    frequency: 30.0
    sensor_timeout: 1.0
    two_d_mode: false

    # Parametry pro kalmanovský filtr
    initial_estimate_covariance: [1e-9, 0.0, 0.0, 0.0, 1e-9, 0.0, 0.0, 0.0, 1e-9]

    # Odemetrie
    odom0: "/model/vehicle_blue/odometry"
    odom0_config: [true, true, false, false, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    
    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 5
    imu0_pose_rejection_threshold: 0.8                 # Note the difference in parameter names
    imu0_twist_rejection_threshold: 0.8                #
    imu0_linear_acceleration_rejection_threshold: 0.8  #
    
    publish_tf: true

